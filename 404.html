<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>그 길은 없다 — 왕은 오지 않는다</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Serif KR',Batang,'바탕',serif;
  background:#0a0603;color:#c9a165;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
}
.wrap{max-width:520px}
.code{font-size:13px;letter-spacing:6px;color:#6d5230;margin-bottom:18px}
h1{font-size:30px;font-weight:900;color:#ffd070;margin-bottom:18px;letter-spacing:-.5px}
p{font-size:15px;line-height:1.9;color:#9c7a4c;margin-bottom:10px}
.rule{width:70px;height:1px;background:#6d5230;margin:26px auto}
a{
  display:inline-block;margin-top:8px;padding:11px 26px;
  border:1px solid #8a6a3e;color:#ffd070;text-decoration:none;font-size:14px;
}
a:hover{background:#1a1008}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>그 길은 없다</h1>
  <p>
    찾으시는 문서가 이 성에는 없습니다.<br>
    주소를 잘못 적었거나, 옮겨졌거나, 애초에 없던 길입니다.
  </p>
  <div class="rule"></div>
  <a href="/">성으로 돌아간다</a>
</div>
</body>
</html>
